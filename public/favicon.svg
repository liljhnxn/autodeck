<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="deckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#FF5212" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B942" />
      <stop offset="100%" stop-color="#FF6B35" />
    </linearGradient>
  </defs>
  <!-- Background rounded box -->
  <rect width="64" height="64" rx="16" fill="#0C0E12" stroke="#262C36" stroke-width="2" />
  
  <!-- Outer glow ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#deckGrad)" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6"/>

  <!-- Sleek Supercar Silhouette -->
  <path d="M14 38 C 14 35, 17 32, 22 31 L 28 26 C 30 24, 34 23, 40 24 L 46 27 C 49 28, 51 31, 51 34 L 52 38 C 52 40, 50 42, 47 42 L 17 42 C 15 42, 14 40, 14 38 Z" fill="url(#deckGrad)" />
  
  <!-- Cabin Glass -->
  <path d="M28 29 L 33 26 C 35 25, 38 25, 41 27 L 45 29 Z" fill="#0C0E12" opacity="0.85" />
  
  <!-- Headlights -->
  <ellipse cx="48" cy="36" rx="2" ry="1" fill="#F5B942" />
  
  <!-- Wheels -->
  <circle cx="23" cy="41" r="5" fill="#191D24" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="23" cy="41" r="2" fill="#FF6B35" />

  <circle cx="43" cy="41" r="5" fill="#191D24" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="43" cy="41" r="2" fill="#FF6B35" />
</svg>

